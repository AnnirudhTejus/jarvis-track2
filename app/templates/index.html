<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jarvis</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
</head>
<body>
  <div class="app">

    <!-- Sidebar -->
    <div class="sidebar">
      <div class="logo"><span>J</span>arvis</div>
      <nav class="nav-section">
        <div class="nav-item active" onclick="switchView('dashboard')"><i class="ti ti-layout-dashboard"></i> Dashboard</div>
        <div class="nav-item" onclick="switchView('companies')"><i class="ti ti-building"></i> Companies</div>
        <div class="nav-item" onclick="switchView('people')"><i class="ti ti-users"></i> People</div>
        <div class="nav-item" onclick="switchView('tasks')"><i class="ti ti-checkbox"></i> Tasks <span class="nav-badge" id="tasks-badge" style="display:none;"></span></div>
      </nav>
      <div class="sidebar-bottom">
        <i class="ti ti-brand-microsoft" style="color:#0078D4;font-size:15px;"></i> Microsoft 365
      </div>
    </div>

    <!-- Main -->
    <div class="main">
      <div class="topbar">
        <div class="topbar-title" id="topbar-title">Dashboard</div>
        <div class="topbar-actions">
          <button class="btn btn-secondary" id="search-btn" onclick="openSearch()" title="Search"><i class="ti ti-search"></i></button>
          <button class="btn btn-primary" id="add-btn">+ Add item</button>
        </div>
      </div>

      <!-- Search overlay -->
      <div id="search-overlay" style="display:none;position:fixed;inset:0;z-index:999;background:rgba(0,0,0,0.45);" onclick="if(event.target===this)closeSearch()">
        <div style="max-width:520px;margin:60px auto 0;padding:0 16px;">
          <div style="display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:11px 14px;border:1.5px solid #5c6ac4;box-shadow:0 4px 24px rgba(0,0,0,0.18);">
            <i class="ti ti-search" style="color:#5c6ac4;font-size:16px;flex-shrink:0;"></i>
            <input id="search-input" type="text" placeholder="Search companies or people…"
              style="flex:1;border:none;outline:none;font-size:15px;color:#2c2c2a;font-family:inherit;background:transparent;"
              oninput="handleSearchInput(this.value)" autocomplete="off" autocorrect="off" spellcheck="false">
            <button onclick="closeSearch()" style="background:none;border:none;cursor:pointer;color:#73726c;font-size:13px;font-family:inherit;padding:2px 4px;">Cancel</button>
          </div>
          <div id="search-results" style="background:#fff;border-radius:12px;margin-top:8px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,0.14);max-height:60vh;overflow-y:auto;"></div>
        </div>
      </div>
<div class="content" id="main-content">
        <!-- Content loads here -->
      </div>
    </div>

    <!-- Detail Panel -->
    <div class="detail-panel" id="detail-panel">
      <div class="detail-header">
        <div class="detail-avatar" id="d-avatar">AC</div>
        <div class="detail-company" id="d-company">Acme Corp</div>
        <div class="detail-ind" id="d-industry">Technology · Kuala Lumpur</div>
      </div>
      <div class="detail-body">
        <div class="d-section">
          <div class="d-title">People</div>
          <div id="d-people"></div>
        </div>
        <div class="d-section">
          <div class="d-title">Tasks</div>
          <div id="d-tasks"></div>
        </div>
        <div class="d-section">
          <div class="d-title">Notes</div>
          <div id="d-notes"></div>
        </div>
        <div class="d-section">
          <div class="d-title">Activity timeline</div>
          <div id="d-timeline"></div>
        </div>
      </div>
    </div>

  </div>
  <script src="/static/js/app.js"></script>
</body>
</html>
