<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jarvis</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
</head>
<body>
  <div class="app">

    <!-- Sidebar -->
    <div class="sidebar">
      <div class="logo"><span>J</span>arvis</div>
      <nav class="nav-section">
        <div class="nav-item" onclick="switchView('dashboard')"><i class="ti ti-layout-dashboard"></i> Dashboard</div>
        <div class="nav-item active" onclick="switchView('companies')"><i class="ti ti-building"></i> Companies</div>
        <div class="nav-item" onclick="switchView('people')"><i class="ti ti-users"></i> People</div>
        <div class="nav-item" onclick="switchView('opportunities')"><i class="ti ti-arrows-right-left"></i> Opportunities</div>
        <div class="nav-item" onclick="switchView('tasks')"><i class="ti ti-checkbox"></i> Tasks <span class="nav-badge">4</span></div>
        <div class="nav-item" onclick="switchView('notes')"><i class="ti ti-notes"></i> Notes</div>
      </nav>
      <div class="sidebar-bottom">
        <i class="ti ti-brand-microsoft" style="color:#0078D4;font-size:15px;"></i> Microsoft 365
      </div>
    </div>

    <!-- Main -->
    <div class="main">
      <div class="topbar">
        <div class="topbar-title" id="topbar-title">Companies</div>
        <div class="topbar-actions">
          <button class="btn btn-secondary"><i class="ti ti-filter"></i> Filter</button>
          <button class="btn btn-primary" id="add-btn">+ Add company</button>
        </div>
      </div>
      <div class="filter-bar">
        <button class="filter-pill active" onclick="switchFilter(this)">All</button>
        <button class="filter-pill" onclick="switchFilter(this)">Today</button>
        <button class="filter-pill" onclick="switchFilter(this)">This week</button>
        <button class="filter-pill" onclick="switchFilter(this)">This month</button>
        <button class="filter-pill" onclick="switchFilter(this)">Follow up needed</button>
      </div>
      <div class="content" id="main-content">
        <!-- Content loads here -->
      </div>
    </div>

    <!-- Detail Panel -->
    <div class="detail-panel" id="detail-panel">
      <div class="detail-header">
        <div class="detail-avatar" id="d-avatar">AC</div>
        <div class="detail-company" id="d-company">Acme Corp</div>
        <div class="detail-ind" id="d-industry">Technology · Kuala Lumpur</div>
      </div>
      <div class="detail-body">
        <div class="d-section">
          <div class="d-title">People</div>
          <div id="d-people"></div>
        </div>
        <div class="d-section">
          <div class="d-title">Tasks</div>
          <div id="d-tasks"></div>
        </div>
        <div class="d-section">
          <div class="d-title">Notes</div>
          <div id="d-notes"></div>
        </div>
        <div class="d-section">
          <div class="d-title">Activity timeline</div>
          <div id="d-timeline"></div>
        </div>
      </div>
    </div>

  </div>
  <script src="/static/js/app.js"></script>
</body>
</html>
